<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TeamKalender — Anmeldung</title>
<style>
/*
  KEY SCREEN — Login
  ====================================================
  Governed by:
   - DESIGN.md: Colors (bg/surface/text/muted/border/border-interactive/
     accent — no new colors introduced), Typography (heading for the
     welcome line, label for the wordmark, body/caption for supporting
     text), Shapes (rounded.lg for the card, rounded.full for the primary
     button and pill-style inputs), Elevation & Depth ("the page-level app
     frame gets the heaviest shadow in the system" — reused here for the
     centered login card, the only floating element on this screen), Brand
     & Style (ruhig/zurückhaltend — calm, reserved, no marketing flourish).
   - EXPERIENCE.md: Information Architecture > "Login" — "Authenticate
     before any calendar data is reachable (Zugriffsschutz, Must-Have NFR).
     Mechanism left to architecture — detailed states (loading,
     invalid-credential, lockout) are a deliberate deferral, not an
     oversight." This mock therefore shows only the calm resting state of
     a generic email/password form — no invented error/loading states,
     no auth-provider specifics the spine hasn't committed to.
   - Voice and Tone: plain, complete sentences; no exclamation marks or
     gamification language, even on the entry screen.

  All hex/radius/spacing values below are copied verbatim from DESIGN.md.
*/
:root{
  --bg:#12151A; --surface:#1A1E24; --surface-2:#20242B;
  --text:#E7EAEE; --muted:#8B95A1; --border:#2B3038; --border-interactive:#647079;
  --accent:#4FD1C5; --accent-on:#0A1F1E;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:9999px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px; --sp7:28px; --sp8:36px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#0B0D10;font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
body{padding:40px 20px;display:flex;justify-content:center;}
.browser-frame{width:100%;max-width:1180px;background:var(--bg);border-radius:var(--r-lg);border:1px solid var(--border);box-shadow:0 24px 60px -20px rgba(6,8,11,0.55),0 4px 14px rgba(6,8,11,0.3);overflow:hidden;height:fit-content;}
.browser-chrome{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);}
.chrome-dots{display:flex;gap:6px;}
.chrome-dots span{width:10px;height:10px;border-radius:50%;background:#3A404A;}
.chrome-dots span:nth-child(1){background:#55474A;}
.chrome-dots span:nth-child(2){background:#57544A;}
.chrome-dots span:nth-child(3){background:#3E5150;}
.chrome-url{flex:1;max-width:320px;margin:0 auto;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-full);padding:5px 14px;font-size:12px;color:var(--muted);}

/* ---- Login canvas: no app chrome — nothing is reachable before auth ---- */
.login-canvas{
  min-height:620px;
  background:
    radial-gradient(circle at 18% 12%, rgba(79,209,197,0.06), transparent 45%),
    radial-gradient(circle at 82% 88%, rgba(194,104,95,0.05), transparent 42%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:60px 24px;
}

.login-card{
  width:100%;max-width:380px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:0 24px 60px -20px rgba(6,8,11,0.55),0 4px 14px rgba(6,8,11,0.3);
  padding:var(--sp7) var(--sp6) var(--sp6);
}

.wordmark{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16.5px;font-weight:700;color:var(--text);letter-spacing:-0.01em;margin-bottom:var(--sp6);}
.wordmark .mark{width:30px;height:30px;border-radius:var(--r-sm);background:linear-gradient(155deg,#59C2C0,#2f7f7e);display:flex;align-items:center;justify-content:center;}
.wordmark .mark svg{width:16px;height:16px;}

.login-heading{font-size:20px;font-weight:700;letter-spacing:-0.01em;color:var(--text);text-align:center;margin-bottom:6px;}
.login-sub{font-size:12px;color:var(--muted);text-align:center;line-height:1.55;margin-bottom:var(--sp6);}

.field-group{margin-bottom:var(--sp4);}
.field-label{font-size:9.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;}
.field-input{width:100%;background:var(--bg);border:1px solid var(--border-interactive);border-radius:var(--r-sm);color:var(--text);font-family:inherit;font-size:12.5px;padding:10px 12px;}
.field-input::placeholder{color:var(--muted);}

.login-meta{display:flex;align-items:center;justify-content:space-between;margin:2px 0 var(--sp5);font-size:11.5px;}
.remember{display:flex;align-items:center;gap:7px;color:var(--muted);}
.remember .box{width:14px;height:14px;border:1px solid var(--border-interactive);border-radius:4px;background:var(--bg);}
.forgot-link{color:var(--accent);font-weight:600;}

.btn-primary{display:block;width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-on);border-radius:var(--r-full);font-size:13px;font-weight:700;padding:11px 18px;font-family:inherit;text-align:center;}

.login-footer{margin-top:var(--sp6);padding-top:var(--sp5);border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center;line-height:1.55;}
</style>
</head>
<body>

<div class="browser-frame">
  <div class="browser-chrome">
    <div class="chrome-dots"><span></span><span></span><span></span></div>
    <div class="chrome-url">kalender.intern.firma.de/anmelden</div>
  </div>

  <div class="login-canvas">
    <div class="login-card">
      <div class="wordmark">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="3" stroke="#0A1F1E" stroke-width="1.6"/><path d="M3 10H21" stroke="#0A1F1E" stroke-width="1.6"/><path d="M8 3V6.5" stroke="#0A1F1E" stroke-width="1.6" stroke-linecap="round"/><path d="M16 3V6.5" stroke="#0A1F1E" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        TeamKalender
      </div>

      <div class="login-heading">Willkommen zurück</div>
      <div class="login-sub">Melde dich an, um den Kalender deines Teams zu sehen.</div>

      <div class="field-group">
        <label class="field-label">E-Mail-Adresse</label>
        <input class="field-input" type="email" placeholder="name@firma.de">
      </div>
      <div class="field-group">
        <label class="field-label">Passwort</label>
        <input class="field-input" type="password" placeholder="••••••••••">
      </div>

      <div class="login-meta">
        <div class="remember"><span class="box"></span>Angemeldet bleiben</div>
        <div class="forgot-link">Passwort vergessen?</div>
      </div>

      <button class="btn-primary">Anmelden</button>

      <div class="login-footer">Selbst gehostet für dein Team — deine Kalenderdaten bleiben bei euch.</div>
    </div>
  </div>
</div>

</body>
</html>
