<div class="view-switcher" role="radiogroup" [attr.aria-label]="'calendar.viewSwitcherLabel' | transloco">
  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      class="view-switcher__item text-label"
      [class.view-switcher__item--active]="active() === option.value"
      [attr.aria-checked]="active() === option.value"
      (click)="select(option.value)"
    >
      {{ option.labelKey | transloco }}
    </button>
  }
</div>
