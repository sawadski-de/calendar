<div class="login-page">
  <div class="login-page__topbar">
    <app-language-switcher />
  </div>

  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="text-heading">{{ 'login.heading' | transloco }}</h1>

    <label class="text-label" for="email">{{ 'login.emailLabel' | transloco }}</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />

    <label class="text-label" for="password">{{ 'login.passwordLabel' | transloco }}</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />

    @if (error()) {
      <p class="login-card__error text-caption" role="alert">{{ 'login.genericError' | transloco }}</p>
    }

    <button type="submit" [disabled]="submitting()">{{ 'login.submit' | transloco }}</button>
  </form>
</div>
