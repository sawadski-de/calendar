<div class="calendar-column" [style.height.px]="totalHeightPx">
  @if (mode() === 'own') {
    @for (slot of slots(); track slot.index) {
      @if (!slot.occupied) {
        <div
          class="calendar-column__slot"
          [style.top.%]="slot.topPercent"
          [style.height.%]="slot.heightPercent"
          appActivatable
          activateOn="dblclick"
          (activate)="activateSlot(slot)"
        ></div>
      }
    }
  }
  @for (block of positioned(); track block.layout.appointment.id) {
    <div
      class="calendar-column__appointment"
      [style.top.%]="block.topPercent"
      [style.height.%]="block.heightPercent"
      [style.left.%]="block.leftPercent"
      [style.width.%]="block.widthPercent"
      appActivatable
      (activate)="activateAppointment(block.layout.appointment.id)"
      [attr.aria-label]="
        mode() === 'colleague'
          ? ('calendar.colleagueSlotLabel'
            | transloco
              : {
                  status:
                    block.layout.appointment.status === 'BitteNichtStoeren'
                      ? ('calendar.statusDnd' | transloco)
                      : ('calendar.statusInterruptible' | transloco)
                })
          : null
      "
    >
      @if (mode() === 'own') {
        <span class="calendar-column__title text-body">{{ block.layout.appointment.title }}</span>
        <span class="calendar-column__time text-caption">{{ block.timeLabel }}</span>
      }
      <app-status-badge [status]="block.layout.appointment.status" />
    </div>
  }
</div>
